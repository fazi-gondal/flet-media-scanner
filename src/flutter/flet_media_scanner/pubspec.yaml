name: flet_media_scanner
description: Flet extension for Android MediaStore — save, list, and delete videos, audio, and images using native Kotlin without any Flutter package dependencies.
version: 1.0.0
publish_to: none

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.0.0"

dependencies:
  flutter:
    sdk: flutter
  flet: ^0.86.0

flutter:
  plugin:
    platforms:
      android:
        package: com.example.flet_media_scanner
        pluginClass: FletMediaScannerPlugin
